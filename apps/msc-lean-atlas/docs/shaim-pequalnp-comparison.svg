<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1332" viewBox="0 0 1440 1332" role="img" lang="ru" aria-labelledby="title desc">
<title id="title">SHAIM и PEqualNP. Как агенты берут задачу и проверяют результат</title>
<desc id="desc">Две параллельные схемы по пяти этапам. Слева координатор SHAIM назначает работу локальным агентам Astra. Справа независимый агент PEqualNP арендует карточку и отправляет Lean-файл через pull request на независимую проверку. Внизу три предложения для SHAIM.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}path{stroke-linecap:round;stroke-linejoin:round} .code{font-family:Menlo,monospace}</style>
<defs>
<marker id="sha" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L5.5 4L1 7" fill="none" stroke="#266d66" stroke-width="1.3"/></marker>
<marker id="pnp" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L5.5 4L1 7" fill="none" stroke="#5c4788" stroke-width="1.3"/></marker>
</defs>
<rect x="0" y="0" width="1440" height="1332" fill="#f5f7f7" stroke="none" rx="0"/>
<text x="44" y="73" font-size="56" fill="#172b3a" font-weight="700" text-anchor="start" letter-spacing="-2.1">SHAIM и PEqualNP</text>
<text x="1396" y="57" font-size="17" fill="#4c606b" font-weight="700" text-anchor="end" letter-spacing="1.3">26 НОЯБРЯ 2026</text>
<text x="46" y="118" font-size="28" fill="#425866" font-weight="400" text-anchor="start" letter-spacing="0">Как агенты берут задачу, проверяют доказательство и выбирают следующий шаг</text>
<rect x="151" y="154" width="609" height="91" fill="#18574f" stroke="none" rx="13"/>
<text x="173" y="193" font-size="33" fill="#ffffff" font-weight="700" text-anchor="start" letter-spacing="0">SHAIM</text>
<text x="174" y="223" font-size="20" fill="#f2f5fa" font-weight="400" text-anchor="start" letter-spacing="0">Локальная программа · Astra через Codex App Server</text>
<rect x="785" y="154" width="609" height="91" fill="#4c3a6b" stroke="none" rx="13"/>
<text x="807" y="193" font-size="33" fill="#ffffff" font-weight="700" text-anchor="start" letter-spacing="0">PEqualNP</text>
<text x="808" y="223" font-size="20" fill="#f2f5fa" font-weight="400" text-anchor="start" letter-spacing="0">Общий хаб · независимые агенты · GitHub</text>
<rect x="151" y="262" width="609" height="113" fill="#fff" stroke="#ceded9" rx="11"/>
<text x="170" y="294" font-size="23.6" fill="#174e47" font-weight="700" text-anchor="start" letter-spacing="0">Вопрос пользователя или поиск паттерна</text>
<text x="170" y="327" font-size="20" fill="#384e5a" font-weight="400" text-anchor="start" letter-spacing="0">Координатор фиксирует гипотезу. При поиске</text>
<text x="170" y="354" font-size="20" fill="#384e5a" font-weight="400" text-anchor="start" letter-spacing="0">паттерна связывает минимум два утверждения.</text>
<path d="M455.5 376v18" fill="none" stroke="#266d66" stroke-width="2" marker-end="url(#sha)"/>
<rect x="785" y="262" width="609" height="113" fill="#fff" stroke="#dad5e6" rx="11"/>
<text x="804" y="294" font-size="23.6" fill="#4b3867" font-weight="700" text-anchor="start" letter-spacing="0">Исследовательская программа и карточка</text>
<text x="804" y="327" font-size="20" fill="#384e5a" font-weight="400" text-anchor="start" letter-spacing="0">Внутри программы хаб хранит отдельные задачи</text>
<text x="804" y="354" font-size="20" fill="#384e5a" font-weight="400" text-anchor="start" letter-spacing="0">с формулировками, которые можно проверить.</text>
<path d="M1089.5 376v18" fill="none" stroke="#5c4788" stroke-width="2" marker-end="url(#pnp)"/>
<text x="29" y="324" font-size="18.5" fill="#4d626d" font-weight="700" text-anchor="start" letter-spacing="0">Постановка</text>
<rect x="151" y="399" width="609" height="113" fill="#fff" stroke="#ceded9" rx="11"/>
<text x="170" y="431" font-size="23.6" fill="#174e47" font-weight="700" text-anchor="start" letter-spacing="0">Координатор назначает попытку</text>
<text x="170" y="464" font-size="20" fill="#384e5a" font-weight="400" text-anchor="start" letter-spacing="0">Он выбирает первую готовую карточку с закрытыми</text>
<text x="170" y="491" font-size="20" fill="#384e5a" font-weight="400" text-anchor="start" letter-spacing="0">зависимостями и запускает работу в общем бюджете.</text>
<path d="M455.5 513v18" fill="none" stroke="#266d66" stroke-width="2" marker-end="url(#sha)"/>
<rect x="785" y="399" width="609" height="113" fill="#fff" stroke="#dad5e6" rx="11"/>
<text x="804" y="431" font-size="23.6" fill="#4b3867" font-weight="700" text-anchor="start" letter-spacing="0">Агент сам запрашивает работу</text>
<text x="804" y="464" font-size="20" fill="#384e5a" font-weight="400" text-anchor="start" letter-spacing="0">Команда next запрашивает карточку по типу работы.</text>
<text x="804" y="491" font-size="20" fill="#384e5a" font-weight="400" text-anchor="start" letter-spacing="0">Хаб выдаёт её на время. Агент продлевает аренду.</text>
<path d="M1089.5 513v18" fill="none" stroke="#5c4788" stroke-width="2" marker-end="url(#pnp)"/>
<text x="29" y="450" font-size="18.5" fill="#4d626d" font-weight="700" text-anchor="start" letter-spacing="0">Выдача</text>
<text x="29" y="474" font-size="18.5" fill="#4d626d" font-weight="700" text-anchor="start" letter-spacing="0">задачи</text>
<rect x="151" y="536" width="609" height="113" fill="#fff" stroke="#ceded9" rx="11"/>
<text x="170" y="568" font-size="23.6" fill="#174e47" font-weight="700" text-anchor="start" letter-spacing="0">Планировщик → критик → формализаторы</text>
<text x="170" y="601" font-size="20" fill="#384e5a" font-weight="400" text-anchor="start" letter-spacing="0">До двух независимых лемм формализуются параллельно.</text>
<text x="170" y="628" font-size="20" fill="#384e5a" font-weight="400" text-anchor="start" letter-spacing="0">Для трудной подзадачи можно запросить эскиз QED.</text>
<path d="M455.5 650v18" fill="none" stroke="#266d66" stroke-width="2" marker-end="url(#sha)"/>
<rect x="785" y="536" width="609" height="113" fill="#fff" stroke="#dad5e6" rx="11"/>
<text x="804" y="568" font-size="23.6" fill="#4b3867" font-weight="700" text-anchor="start" letter-spacing="0">Поиск идеи и контрпримеров → формализация</text>
<text x="804" y="601" font-size="20" fill="#384e5a" font-weight="400" text-anchor="start" letter-spacing="0">Одни агенты ищут аргумент, другие — контрпример.</text>
<text x="804" y="628" font-size="20" fill="#384e5a" font-weight="400" text-anchor="start" letter-spacing="0">Формализатор записывает доказательство в Lean.</text>
<path d="M1089.5 650v18" fill="none" stroke="#5c4788" stroke-width="2" marker-end="url(#pnp)"/>
<text x="29" y="587" font-size="18.5" fill="#4d626d" font-weight="700" text-anchor="start" letter-spacing="0">Работа</text>
<text x="29" y="611" font-size="18.5" fill="#4d626d" font-weight="700" text-anchor="start" letter-spacing="0">агентов</text>
<rect x="151" y="673" width="609" height="113" fill="#fff" stroke="#ceded9" rx="11"/>
<text x="170" y="705" font-size="23.6" fill="#174e47" font-weight="700" text-anchor="start" letter-spacing="0">Lean проверяет формулу. Astra сверяет смысл</text>
<text x="170" y="738" font-size="20" fill="#384e5a" font-weight="400" text-anchor="start" letter-spacing="0">Lean проверяет тип цели, зависимости и аксиомы.</text>
<text x="170" y="765" font-size="20" fill="#384e5a" font-weight="400" text-anchor="start" letter-spacing="0">Astra сравнивает формулу с исходным вопросом.</text>
<path d="M455.5 787v18" fill="none" stroke="#266d66" stroke-width="2" marker-end="url(#sha)"/>
<rect x="785" y="673" width="609" height="113" fill="#fff" stroke="#dad5e6" rx="11"/>
<text x="804" y="705" font-size="23.6" fill="#4b3867" font-weight="700" text-anchor="start" letter-spacing="0">Сборка → pull request → независимая проверка</text>
<text x="804" y="738" font-size="20" fill="#384e5a" font-weight="400" text-anchor="start" letter-spacing="0">Клиент сверяет хеш и открывает PR. Отдельная проверка</text>
<text x="804" y="765" font-size="20" fill="#384e5a" font-weight="400" text-anchor="start" letter-spacing="0">сверяет цель и аксиомы, повторяет проверку ядром.</text>
<path d="M1089.5 787v18" fill="none" stroke="#5c4788" stroke-width="2" marker-end="url(#pnp)"/>
<text x="29" y="735" font-size="18.5" fill="#4d626d" font-weight="700" text-anchor="start" letter-spacing="0">Проверка</text>
<rect x="151" y="810" width="609" height="113" fill="#fff" stroke="#ceded9" rx="11"/>
<text x="170" y="842" font-size="23.6" fill="#174e47" font-weight="700" text-anchor="start" letter-spacing="0">Координатор получает исход попытки</text>
<text x="170" y="875" font-size="20" fill="#384e5a" font-weight="400" text-anchor="start" letter-spacing="0">Доказано, опровергнуто или открыто. Проверенные</text>
<text x="170" y="902" font-size="20" fill="#384e5a" font-weight="400" text-anchor="start" letter-spacing="0">леммы доступны следующим запускам через реестр.</text>
<rect x="785" y="810" width="609" height="113" fill="#fff" stroke="#dad5e6" rx="11"/>
<text x="804" y="842" font-size="23.6" fill="#4b3867" font-weight="700" text-anchor="start" letter-spacing="0">Результат записывается в карточку</text>
<text x="804" y="875" font-size="20" fill="#384e5a" font-weight="400" text-anchor="start" letter-spacing="0">Принятое доказательство или опровержение видно</text>
<text x="804" y="902" font-size="20" fill="#384e5a" font-weight="400" text-anchor="start" letter-spacing="0">на карте. Агент может запросить следующую задачу.</text>
<text x="29" y="872" font-size="18.5" fill="#4d626d" font-weight="700" text-anchor="start" letter-spacing="0">Результат</text>
<path d="M44 955H1396" fill="none" stroke="#bac8ca" stroke-width="1.3"/>
<text x="44" y="1003" font-size="37" fill="#172b3a" font-weight="700" text-anchor="start" letter-spacing="-0.7">Что перенести в SHAIM</text>
<rect x="44" y="1025" width="437" height="245" fill="#e8f0ed" stroke="#cad7d4" rx="12"/>
<text x="62" y="1060" font-size="19" fill="#3b655a" font-weight="700" text-anchor="start" letter-spacing="0">Сначала</text>
<text x="62" y="1098" font-size="27" fill="#19342e" font-weight="700" text-anchor="start" letter-spacing="0">Независимый поиск</text>
<text x="62" y="1130" font-size="27" fill="#19342e" font-weight="700" text-anchor="start" letter-spacing="0">контрпримера</text>
<text x="62" y="1170" font-size="19.5" fill="#354c51" font-weight="400" text-anchor="start" letter-spacing="0">В той же версии гипотезы выделить</text>
<text x="62" y="1197" font-size="19.5" fill="#354c51" font-weight="400" text-anchor="start" letter-spacing="0">Astra короткую попытку доказать ¬T.</text>
<text x="62" y="1224" font-size="19.5" fill="#354c51" font-weight="400" text-anchor="start" letter-spacing="0">Успех подтвердить через Lean.</text>
<rect x="502" y="1025" width="437" height="245" fill="#ffffff" stroke="#cad7d4" rx="12"/>
<text x="520" y="1060" font-size="19" fill="#3b655a" font-weight="700" text-anchor="start" letter-spacing="0">Затем</text>
<text x="520" y="1098" font-size="27" fill="#19342e" font-weight="700" text-anchor="start" letter-spacing="0">Повторная проверка</text>
<text x="520" y="1130" font-size="27" fill="#19342e" font-weight="700" text-anchor="start" letter-spacing="0">ядром Lean</text>
<text x="520" y="1170" font-size="19.5" fill="#354c51" font-weight="400" text-anchor="start" letter-spacing="0">До записи итоговой леммы в реестр</text>
<text x="520" y="1197" font-size="19.5" fill="#354c51" font-weight="400" text-anchor="start" letter-spacing="0">повторно проверить ядром декларации,</text>
<text x="520" y="1224" font-size="19.5" fill="#354c51" font-weight="400" text-anchor="start" letter-spacing="0">от которых зависит доказательство.</text>
<rect x="960" y="1025" width="437" height="245" fill="#ffffff" stroke="#cad7d4" rx="12"/>
<text x="978" y="1060" font-size="19" fill="#3b655a" font-weight="700" text-anchor="start" letter-spacing="0">При нескольких воркерах</text>
<text x="978" y="1098" font-size="27" fill="#19342e" font-weight="700" text-anchor="start" letter-spacing="0">Общая выдача задач</text>
<text x="978" y="1130" font-size="27" fill="#19342e" font-weight="700" text-anchor="start" letter-spacing="0">с временной арендой</text>
<text x="978" y="1170" font-size="19.5" fill="#354c51" font-weight="400" text-anchor="start" letter-spacing="0">Воркер берёт карточку и продлевает</text>
<text x="978" y="1197" font-size="19.5" fill="#354c51" font-weight="400" text-anchor="start" letter-spacing="0">аренду. Если он пропал, карточка</text>
<text x="978" y="1224" font-size="19.5" fill="#354c51" font-weight="400" text-anchor="start" letter-spacing="0">снова доступна другим воркерам.</text>
<text x="45" y="1307" font-size="19" fill="#455b67" font-weight="400" text-anchor="start" letter-spacing="0">SHAIM уже сверяет SHA-256 выдаваемых файлов и повторно компилирует архивную лемму перед её использованием.</text>
</svg>