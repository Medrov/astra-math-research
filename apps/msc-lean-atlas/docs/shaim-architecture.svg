<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1050" viewBox="0 0 1240 1050" role="img" aria-labelledby="title desc" lang="ru">
<title id="title">Архитектура SHAIM. Математические исследования</title>
<desc id="desc">Четыре пользовательских маршрута. Самостоятельный поиск и исследовательская программа запускают общий координатор. Он передаёт фиксированную цель исполнителям SHAIM и получает результат для следующего шага. Заданная задача идёт непосредственно к исполнителю. QED готовит текстовый ответ или эскиз. Lean проверяет формальную цель. Astra отдельно оценивает смысл, а SHAIM сохраняет результаты и проверенные леммы.</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1l6 3.5L1 8" fill="none" stroke="#526575" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="loop" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1l7 4-7 4" fill="none" stroke="#207267" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
